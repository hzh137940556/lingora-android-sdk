# Demo 的 SDK 来源；远端模式同时填写固定版本，本机凭据不写在这里。
lingoraSdkMode=local
# lingoraSdkVersion=0.1.0
# lingoraLocalSdkPath=../sdk
lingoraContentDeliveryUrl=https://cosly-dev.s3.us-west-2.amazonaws.com/lingora/localstrings/dev/v1

# 独立构建的 JVM、AndroidX、Kotlin 风格和资源命名空间配置。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
