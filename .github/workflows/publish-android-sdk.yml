name: Android SDK CI and Release
# 运行列表先按 Tag 显示渠道；真正发布仍以 verify-tag 校验结果为准。
run-name: >-
  ${{ startsWith(github.ref, 'refs/tags/android-sdk-')
      && format('Publish Android SDK [{0}] — {1}', startsWith(github.ref, 'refs/tags/android-sdk-dev-') && 'dev' || 'release', github.ref_name)
      || format('Android SDK CI — {0}', github.head_ref || github.ref_name) }}

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ["android-sdk-*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
    working-directory: sdk

jobs:
  verify:
    # 配置分支必需检查时使用此显示名，内部 verify 标识保持稳定。
    name: Android SDK CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
      coordinate: ${{ steps.release.outputs.coordinate }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source and approval configuration
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-sdk-')
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/sdk_release.py verify-tag
          --tag "$TAG_NAME"
          --repository "$GITHUB_REPOSITORY"
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test SDK and validate Maven publication
        env:
          SDK_VERSION: ${{ steps.release.outputs.version || '0.1.0-SNAPSHOT' }}
          SDK_CHANNEL: ${{ steps.release.outputs.channel || 'release' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: make verify VERSION="$SDK_VERSION" SDK_CHANNEL="$SDK_CHANNEL"

  publish:
    # 审批前即可看到已校验的渠道和版本，Environment 仍共用同一套门禁。
    name: >-
      ${{ needs.verify.outputs.channel
          && format('Publish Android SDK [{0}] — {1}', needs.verify.outputs.channel, needs.verify.outputs.version)
          || 'Publish Android SDK (tag only)' }}
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-sdk-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: android-sdk-release
    permissions:
      contents: read
      actions: read
      packages: write
    concurrency:
      group: android-sdk-publish-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      SDK_VERSION: ${{ needs.verify.outputs.version }}
      SDK_CHANNEL: ${{ needs.verify.outputs.channel }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      TAG_NAME: ${{ needs.verify.outputs.tag }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck approved release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/sdk_release.py verify-tag
          --tag "$TAG_NAME"
          --repository "$GITHUB_REPOSITORY"
          --expected-sha "$RELEASE_SHA"

      - name: Reject an existing package version
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/sdk_release.py check-package
          --channel "$SDK_CHANNEL" --version "$SDK_VERSION"
          --repository "$GITHUB_REPOSITORY"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish approved package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_COORDINATE: ${{ needs.verify.outputs.coordinate }}
          MAVEN_REPOSITORY_URL: https://maven.pkg.github.com/hzh137940556/lingora-android-sdk
        run: |
          printf 'Publishing %s to %s\n' "$SDK_COORDINATE" "$MAVEN_REPOSITORY_URL"
          ./gradlew \
            :lingora-android-sdk:publishReleasePublicationToGitHubPackagesRepository \
            -PVERSION_NAME="$SDK_VERSION" -PSDK_CHANNEL="$SDK_CHANNEL" \
            --no-daemon
          # 上传成功后再记录结果；Demo 在独立工作流中验收，不影响上传结果。
          printf '::notice title=SDK uploaded::%s -> %s\n' "$SDK_COORDINATE" "$MAVEN_REPOSITORY_URL"
          {
            printf '## ✅ SDK 包已上传\n\n'
            printf -- '- Maven 仓库：[%s](%s)\n' "$MAVEN_REPOSITORY_URL" "$MAVEN_REPOSITORY_URL"
            printf -- '- 包列表：[GitHub Packages](https://github.com/hzh137940556?tab=packages&repo_name=lingora-android-sdk)\n'
            printf -- '- 依赖坐标：`%s`\n' "$SDK_COORDINATE"
            printf -- '- 渠道：`%s`\n- Tag：`%s`\n- Commit SHA：`%s`\n' "$SDK_CHANNEL" "$TAG_NAME" "$RELEASE_SHA"
            printf '\n```kotlin\nimplementation("%s")\n```\n' "$SDK_COORDINATE"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  demo-smoke-dispatch:
    # 调度权与包写权限隔离；触发失败不改变包已上传的事实。
    name: Request independent Demo package smoke
    needs: [verify, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-sdk-')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Demo with verified coordinates and SHA
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.verify.outputs.channel }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHA: ${{ needs.verify.outputs.sha }}
          BRANCH: ${{ needs.verify.outputs.branch }}
        working-directory: ${{ runner.temp }}
        run: |
          if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/android-demo-ci.yml/dispatches" \
            -f ref="$BRANCH" -f "inputs[channel]=$CHANNEL" -f "inputs[version]=$VERSION" -f "inputs[sha]=$SHA"; then
            printf 'Demo smoke 已请求：%s %s @ %s；请另行检查 Demo 工作流结果。\n' "$CHANNEL" "$VERSION" "$SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '::warning::SDK 已上传，但 Demo smoke 未触发。请确认 Demo 工作流已进入默认分支，再手动运行。\n'
            printf '⚠️ SDK 已上传，Demo smoke 尚未触发/验收。\n' >> "$GITHUB_STEP_SUMMARY"
          fi
