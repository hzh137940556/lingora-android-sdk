# 独立验证 Actions 触发与 runner 执行，不构建或发布 SDK。
name: CI Smoke Test

on:
  push:
  pull_request:
    branches: [develop, main]

permissions: {}

jobs:
  smoke:
    name: CI Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print success marker and event context
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          printf 'CI_SMOKE_OK\n'
          printf 'event=%s\nref=%s\nsha=%s\n' \
            "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"
